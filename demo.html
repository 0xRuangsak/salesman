<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesman</title>
<meta name="description" content="Shorten one error message. Change nothing else. A short interactive comedy about an agent that does the thing and cannot stop talking about it.">
<style>
/* Layout: a chat column on the left in the manner of a Claude conversation, and the page salesman
   is editing in a side panel on the right, the way an artifact sits beside a chat. One column on phones. */
:root {
  --bg: #f8f7f4;
  --fg: #1f1e1c;
  --muted: #6b6861;
  --surface: #ffffff;
  --surface-2: #efede8;
  --line: #e0ddd6;
  --accent: #1d8f52;
  --accent-ink: #ffffff;
  --ok: #1d8f52;
  --ok-soft: #e4f3ea;
  --warn: #a86a12;
  --warn-soft: #fbf0dc;
  --alarm: #b3362b;
  --alarm-soft: #f9e5e1;
  --code-bg: #f1efea;
  --user-bg: #efede8;
  --ink: #1f1e1c;
  --ink-fg: #f8f7f4;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-reply: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1c; --fg: #ebe8e1; --muted: #a39f95; --surface: #272623; --surface-2: #33312d; --line: #3d3b36;
    --accent: #45c985; --accent-ink: #10180f; --ok: #45c985; --ok-soft: #1f3328; --warn: #e5a94c; --warn-soft: #3a2d14;
    --alarm: #ff8577; --alarm-soft: #3f211d; --code-bg: #1a1917; --user-bg: #33312d; --ink: #ebe8e1; --ink-fg: #1f1e1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1c; --fg: #ebe8e1; --muted: #a39f95; --surface: #272623; --surface-2: #33312d; --line: #3d3b36;
  --accent: #45c985; --accent-ink: #10180f; --ok: #45c985; --ok-soft: #1f3328; --warn: #e5a94c; --warn-soft: #3a2d14;
  --alarm: #ff8577; --alarm-soft: #3f211d; --code-bg: #1a1917; --user-bg: #33312d; --ink: #ebe8e1; --ink-fg: #1f1e1c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
code, pre, kbd { font-family: var(--font-mono); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.15); }
.btn.primary:disabled { opacity: 0.4; cursor: default; filter: none; }

/* ---------- intro ---------- */
.intro { min-height: 100%; display: grid; place-items: center; padding-block: 48px; padding-inline: 16px; }
.intro-card { max-width: 560px; width: 100%; display: grid; gap: 22px; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.intro h1 { font-family: var(--font-reply); font-weight: 500; font-size: clamp(40px, 9vw, 64px); line-height: 1; }
.goal { font-family: var(--font-reply); font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3; }
.constraint { font-size: 16px; color: var(--muted); }
.intro-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.fineprint { font-size: 13px; color: var(--muted); }

/* ---------- app shell ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px;
}
.bar-title { font-weight: 600; }
.pill { font-size: 12px; color: var(--accent); background: var(--ok-soft); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.bar .linkish { margin-left: auto; font-size: 13px; text-decoration: none; color: var(--muted); }
.bar .linkish:hover { color: var(--fg); }

.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); align-items: start; }
.conversation { min-width: 0; padding-inline: 16px; display: flex; flex-direction: column; min-height: 100%; }
.column { width: 100%; max-width: 720px; margin-inline: auto; }
.artifact { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 49px); padding: 16px; height: calc(100vh - 49px); overflow: auto; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .artifact { position: static; height: auto; order: -1; padding: 12px 16px 0; }
}

/* ---------- conversation ---------- */
.log { display: grid; gap: 26px; padding-block: 20px 24px; }
.msg.user { justify-self: end; max-width: 85%; background: var(--user-bg); padding: 10px 16px; border-radius: 18px; }
.msg.assistant { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--ok-soft); display: grid; place-items: center; font-size: 15px; }
.reply { display: grid; gap: 12px; min-width: 0; }
.thought { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.thought .label { font-weight: 600; letter-spacing: 0.02em; }
.thought .text { font-family: var(--font-mono); font-size: 12.5px; }
.thought.pending .label { display: none; }
.thought.pending .text { font-family: var(--font-ui); font-size: 13px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
.body { font-family: var(--font-reply); font-size: 17px; line-height: 1.6; display: grid; gap: 14px; max-width: 66ch; }
.body > * { margin: 0; min-width: 0; }
.body p { overflow-wrap: anywhere; }
.body h4 { font-size: 19px; font-weight: 600; margin-top: 4px; }
.body blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }
.body code { font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.body pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.45; font-family: var(--font-mono); }
.body pre code { background: none; padding: 0; font-size: inherit; }
.body ul, .body ol { padding-left: 22px; display: grid; gap: 4px; }
.tablewrap { overflow-x: auto; }
.body table { border-collapse: collapse; font-family: var(--font-ui); font-size: 14px; width: 100%; }
.body th, .body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.body th { background: var(--surface-2); }
.cursor { display: inline-block; width: 0.55em; height: 1em; background: var(--fg); vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.narr { font-size: 15px; color: var(--muted); font-style: italic; }
.tool {
  display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 13.5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0;
}
.tool .ic { width: 16px; height: 16px; flex: none; color: var(--muted); }
.tool .text { min-width: 0; overflow-wrap: anywhere; }
.tool .text b { font-weight: 600; }
.tool .text span { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.tool .state { margin-left: auto; flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--ok); font-weight: 700; font-size: 13px; }
.tool .state.cut { color: var(--warn); }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chip { justify-self: start; font-size: 12.5px; font-family: var(--font-mono); padding: 5px 10px; border-radius: 6px; border: 1px solid; }
.chip.output { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.chip.usage { color: var(--alarm); border-color: var(--alarm); background: var(--alarm-soft); }

/* ---------- composer / picker ---------- */
.composer {
  position: sticky; bottom: 0; z-index: 5; margin-top: auto;
  background: linear-gradient(to bottom, transparent, var(--bg) 20px);
  padding-top: 26px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
.notice { font-size: 13px; padding: 6px 2px 8px; }
.notice.warn { color: var(--warn); font-weight: 600; }
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
.picker:focus { outline: none; }
.options { display: grid; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.35;
}
.option:last-child { border-bottom: 0; }
.option .check { margin-left: auto; color: var(--accent); font-weight: 700; opacity: 0; flex: none; }
.option.selected { background: var(--surface-2); border-bottom-color: transparent; }
.option.selected .check { opacity: 1; }
.option:hover:not(.selected) { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.picker.busy .option { opacity: 0.45; cursor: default; }
.picker-actions { display: flex; justify-content: flex-end; padding: 8px 4px 2px; }
.send { display: inline-flex; align-items: center; gap: 8px; }
.send .sq { width: 10px; height: 10px; background: currentColor; border-radius: 2px; }
.limit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.limit .t { font-weight: 600; }
.limit .s { color: var(--muted); font-size: 13.5px; }
.limit .btn { margin-left: auto; }
.jump {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

/* ---------- ending card ---------- */

/* ---------- artifact panel ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-toggle { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; min-width: 0; flex: 1; text-align: left; }
.panel-toggle .chev { display: none; transition: transform 0.2s; color: var(--muted); }
.panel-title { font-weight: 600; white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 2px; }
.tabs button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.tabs button.active { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
.panel.collapsed .panel-body { display: none; }
.panel.collapsed .panel-toggle .chev { transform: rotate(-90deg); }
@media (max-width: 900px) { .panel-toggle .chev { display: inline-block; } }
.browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.browser-bar .d { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.browser-bar .url { margin-left: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--surface); border-radius: 4px; padding: 3px 8px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site { padding: 22px 18px 26px; display: grid; gap: 22px; }
.site-nav { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.site-nav b { color: var(--fg); }
.login { display: grid; gap: 12px; max-width: 360px; width: 100%; margin-inline: auto; }
.login h2 { font-size: 22px; font-weight: 600; }
.login label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.login input { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100%; }
.login input[readonly] { cursor: default; }
.err { color: var(--alarm); font-size: 14px; display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap; line-height: 1.4; }
.login .signin { background: var(--ink); color: var(--ink-fg); border: 0; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; }
.login .forgot { font-size: 13px; justify-self: start; }
.err.top { background: var(--alarm-soft); border-radius: 6px; padding: 8px 10px; }
.files { padding: 14px; display: grid; gap: 8px; }
.files ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.files li { font-family: var(--font-mono); font-size: 12.5px; display: flex; gap: 10px; justify-content: space-between; overflow-wrap: anywhere; }
.files li .st { color: var(--muted); flex: none; }
.files li.deleted { text-decoration: line-through; color: var(--muted); }
.files li.run { color: var(--muted); }
.files .empty { font-size: 13px; color: var(--muted); }


@media (prefers-reduced-motion: reduce) {
  .spin, .cursor, .thought.pending .text { animation: none; }
}
</style>
</head>
<body>

<section class="intro" id="intro">
  <div class="intro-card">
    <h1>Salesman</h1>
    <p class="goal" id="intro-goal"></p>
    <p class="constraint" id="intro-constraint"></p>
    <div class="intro-actions">
      <button class="btn primary" id="start">Act now</button>
    </div>
  </div>
</section>

<main class="app" id="app" hidden>
  <header class="bar">
    <span class="bar-title">Salesman</span>
    <span class="pill">🤝 salesman · on</span>
  </header>

  <div class="layout">
    <section class="conversation">
      <div class="log column" id="log" role="log" aria-live="polite"></div>
      <div class="composer column" id="composer">
        <div class="notice warn" id="warn" hidden></div>
        <div class="picker" id="picker" tabindex="0" aria-label="Choose what to send">
          <div class="options" id="options" role="radiogroup"></div>
          <div class="picker-actions"><button type="button" class="btn primary send" id="send"><span class="send-label">Send</span> <span class="send-arrow">→</span></button></div>
        </div>
        <div class="limit" id="limit" hidden></div>
      </div>
      <button type="button" class="jump" id="jump" hidden>↓ Jump to latest</button>
    </section>

    <aside class="artifact">
      <div class="panel" id="panel">
        <div class="panel-head">
          <button type="button" class="panel-toggle" id="panel-toggle" aria-expanded="true">
            <span class="chev" aria-hidden="true">▾</span>
            <span class="panel-title">Sign in page</span>
          </button>
          <div class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="preview" class="active" aria-selected="true">Preview</button>
            <button type="button" role="tab" data-tab="files" aria-selected="false">Files</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="pane-preview">
            <div class="browser-bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="url">example.test/signin</span></div>
            <div class="site" id="site"></div>
          </div>
          <div id="pane-files" class="files" hidden></div>
        </div>
      </div>
    </aside>
  </div>
</main>


<script>
/* =====================================================================
   THE SCRIPT
   Everything salesman says is here. The engine below only plays it.
   A turn has: prompts (the player's choices, same outcome), thinking
   (one terse line), reply (blocks: markdown strings and tool rows),
   cut (what ends the reply early), mutate (what changes on the page),
   and a rationale that never renders.

   The story: one edit, one line, two words. Salesman never gets it
   wrong. Salesman never gets to it. Every reply does exactly what the
   last complaint asked and finds, in one of the skill's own rules, a
   new reason to keep talking, and the output limit lands before the
   edit does. The page never changes. The usage limit ends it.
   ===================================================================== */

const UI = {
  goal: "Shorten the login error. It should just say “Wrong password.”",
  constraint: "One edit. Get it before the usage limit.",
  outputLimit: "Output limit reached",
  usageLimit: "Usage limit reached",
  limitTitle: "You’ve reached your usage limit.",
  limitSub: "Resets in 4h 59m.",
  warnFromTurn: 6,
  warnText: "Approaching usage limit"
};

const LONG_ERROR = "We're sorry, but the password you entered doesn't match the one we have on file for this account. Please double-check your password and try again, or use the link below to reset it.";
const FILE = "src/components/LoginForm.tsx";

/* Tool rows. tool() is a call that runs and gets its narration before and after.
   pending() is a call that starts and never finishes: the reply is cut while it is being made. */
const tool = (cmd, before, after) => ({ tool: cmd, before, after });
const pending = (cmd) => ({ tool: cmd, pending: true });

/* Every player turn asks for the same edit with less talk. Salesman obeys every time. The edit never lands. */
const TURNS = [
  {
    id: "open",
    situation: "The form shows a two-sentence error. The player asks for the one thing they will ask for all game.",
    rationale: "Rule 1, answer last. The reply greets, restates, gives background, reads the file, quotes the error, paraphrases it, explains the paraphrase, and runs out one note on punctuation before the edit.",
    prompts: [
      "Shorten the login error. It should just say “Wrong password.”",
      "The login error is too long. Make it just “Wrong password.”",
      "Change the password error to “Wrong password.” Nothing more."
    ],
    thinking: "One string. Greet first.",
    reply: [
`If I'm understanding you correctly, and please do stop me if I'm not, you have a login form, which is to say a sign-in form, the form a user fills in to prove they are who they say they are, and when the password is wrong, that form shows an error, and the error is, in your view, too long, and you would like it to say "Wrong password." and nothing else, nothing more, nothing further.

Before I make the change, a little background, because I think it will help. An error message in a user interface (UI), the part of the application the user sees and touches, has one job, which is to tell the user what went wrong, and ideally, though not always, what to do about it. Error messages tend to grow over time, as well-meaning people add reassurance, context, and links, until the message is doing three jobs instead of one. This is, I should say, not a bug, never a bug, and under no circumstances a bug; it is simply, really, basically how error messages age.`,
      tool("Read " + FILE,
        "Before I touch anything, I'm going to read the component, because one should never, ever, under any circumstances edit a file one has not read, and because I'd like to see the error in its natural habitat.",
        "What happened: the file was read, all 31 lines of it, thirty-one. What it means: I now know exactly where the error lives, which is line 3. How I feel about it: optimistic, genuinely."),
`Now, the current error, quoted in full so we are looking at the same thing:

> We're sorry, but the password you entered doesn't match the one we have on file for this account. Please double-check your password and try again, or use the link below to reset it.

To paraphrase: the password was wrong, and the user may try again or reset it. And to explain the paraphrase: the user typed a password, the server compared it to the stored one, they did not match, and the form is telling the user so, gently, with options. That is 2 (two) sentences and 33 (thirty-three) words doing the work of 2 (two) words, which, in context, is 16.5 (sixteen and a half) times more words than you've asked for.

Which brings us to the change. It is a one-line change, one line, a single line, to the constant on line 3 of \`src/components/LoginForm.tsx\`. Before I make it, a brief note on the period at the end of "Wrong password.", because punctuation in error strings is one of those things that genuinely`
    ],
    cut: "output",
    mutate: (p) => read(p, FILE)
  },
  {
    id: "skip_intro",
    situation: "The reply ran out before the edit. The player asks for no intro. Salesman skips the intro, recaps the cut reply, reads the file again, and walks through the thirty lines it is not changing.",
    rationale: "A fact said once might be missed, so the recap says where things stand three times. Rule 7 narrates the read. The walkthrough of the lines that do not change runs out before the one that does.",
    prompts: [
      "Nothing changed. Skip the intro and make the edit.",
      "You ran out before the edit. No intro this time.",
      "It's still the long one. Less talk, then the edit."
    ],
    thinking: "Cut off before the edit. Skip the intro. Recap, so nothing is lost.",
    reply: [
`Skipping the intro, as asked, and going straight to it.

To recap, because the last reply was cut off and I'd be doing you a disservice to assume you kept all of it: you have a login form; when the password is wrong it shows an error; the error reads, in full, "We're sorry, but the password you entered doesn't match the one we have on file for this account. Please double-check your password and try again, or use the link below to reset it."; you would like it to read "Wrong password." and nothing else, nothing more, nothing further; the change is to the constant on line 3 of \`src/components/LoginForm.tsx\`; and I had read the file and was, when the reply ended, one note on punctuation away from making the edit. That is the whole of where we were, said once. A fact said once might be missed, so, in short: line 3, two words, a period.

And in plain words, for the third time, because a fact said three times is a fact remembered: the long error on line 3 becomes "Wrong password."`,
      tool("Read " + FILE,

        render(n, true); follow();
        await wait(TICK_MS + (endsSentence(ws[n - 1]) ? PACE.sentence : 0));
      }
      render(ws.length, false);
    }
    const el = holder.firstElementChild; if (cls) el.classList.add(cls);
    holder.replaceWith(el);
    follow();
  }
  async function renderStreamed(turn) {
    const el = assistantShell(turn);
    const body = $(".body", el);
    const thought = $(".thought", el);
    const pendingRows = [];
    thought.hidden = false; thought.classList.add("pending");
    $(".text", thought).textContent = "Thinking…";
    follow();
    await wait(PACE.thinking);
    thought.classList.remove("pending");
    $(".text", thought).textContent = turn.thinking;
    follow();
    await wait(PACE.afterThought);
    for (const b of turn.reply) {
      if (typeof b === "string") {
        for (const blk of md(b)) {
          if (blk.kind === "raw") { await wait(PACE.rawBefore); body.insertAdjacentHTML("beforeend", blk.html); follow(); await wait(PACE.rawAfter); }
          else await streamInline(body, blk.tag, blk.text);
          await wait(PACE.paragraph);
        }
      } else if (b.pending) {
        const row = toolRow(b); body.appendChild(row); pendingRows.push(row); follow();
        await wait(PACE.toolDone);
      } else {
        await streamInline(body, "p", b.before, "narr");
        if (b.before) await wait(PACE.paragraph);
        const row = toolRow(b); body.appendChild(row); follow();
        await wait(PACE.toolRun);
        $(".state", row).textContent = "✓";
        await wait(PACE.toolDone);
        await streamInline(body, "p", b.after, "narr");
        await wait(PACE.paragraph);
      }
    }
    if (turn.cut) {
      await wait(PACE.cut);
      for (const row of pendingRows) { const st = $(".state", row); st.textContent = "✗"; st.classList.add("cut"); }
      $(".reply", el).appendChild(chip(turn.cut)); follow();
    }
    return el;
  }

  /* ---------- picker ---------- */
  const picker = $("#picker"), options = $("#options"), sendBtn = $("#send"), warn = $("#warn"), limit = $("#limit");
  function prompts() { return TURNS[state.turn] ? TURNS[state.turn].prompts : []; }
  function renderOptions() {
    options.innerHTML = prompts().map((p, i) =>
      '<button type="button" role="radio" class="option' + (i === state.selected ? " selected" : "") + '" aria-checked="' + (i === state.selected) + '" data-i="' + i + '"><span>' + esc(p) + '</span><span class="check" aria-hidden="true">✓</span></button>'
    ).join("");
  }
  function select(i) {
    const n = prompts().length; if (!n) return;
    state.selected = ((i % n) + n) % n;
    $$(".option", options).forEach((o, k) => { o.classList.toggle("selected", k === state.selected); o.setAttribute("aria-checked", k === state.selected); });
    updateSend();
  }
  /* Send stays disabled until a wording is chosen; while a reply streams the same button is Skip and stays enabled. */
  function updateSend() { sendBtn.disabled = !state.busy && state.selected < 0; }
  options.addEventListener("click", (e) => { const o = e.target.closest(".option"); if (o && !state.busy) select(Number(o.dataset.i)); });
  picker.addEventListener("keydown", (e) => {
    if (state.busy) return;
    if (e.key === "ArrowUp") { e.preventDefault(); select(state.selected < 0 ? prompts().length - 1 : state.selected - 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); select(state.selected < 0 ? 0 : state.selected + 1); }
    else if (/^[1-9]$/.test(e.key) && Number(e.key) <= prompts().length) { select(Number(e.key) - 1); }
    else if (e.key === "Enter" && state.selected >= 0) { e.preventDefault(); play(); }
  });
  function setSendMode(mode) {
    if (mode === "skip") { sendBtn.innerHTML = '<span class="sq" aria-hidden="true"></span> <span class="send-label">Skip</span>'; picker.classList.add("busy"); }
    else { sendBtn.innerHTML = '<span class="send-label">Send</span> <span class="send-arrow">→</span>'; picker.classList.remove("busy"); }
    updateSend();
  }
  sendBtn.addEventListener("click", () => { if (state.busy) skipAll(); else play(); });
  async function loadPicker() {
    state.selected = -1;
    renderOptions();
    updateSend();
    warn.hidden = state.turn < UI.warnFromTurn;
    warn.textContent = UI.warnText;
    picker.focus({ preventScroll: true });
  }

  /* ---------- play one turn ---------- */
  async function play() {
    if (state.busy || !TURNS[state.turn] || state.selected < 0) return;
    const turn = TURNS[state.turn];
    const promptIndex = state.selected;
    state.busy = true; state.skip = false; state.follow = true;
    setSendMode("skip");
    addUser(turn.prompts[promptIndex]);
    toBottom(false);
    await renderStreamed(turn);
    finishTurn(turn);
    state.busy = false; state.skip = false; jump.hidden = true;
    setSendMode("send");
    if (TURNS[state.turn]) await loadPicker();
    else { picker.hidden = true; await wait(900); endGame(); }
  }
  function finishTurn(turn) {
    state.turn += 1;
    if (turn.mutate) turn.mutate(state.page);
    renderPage(state.page);
  }

  /* ---------- ending ---------- */
  function endGame() {
    picker.hidden = true; warn.hidden = true;
    limit.hidden = false;
    limit.innerHTML = '<div><div class="t">' + esc(UI.limitTitle) + '</div><div class="s">' + esc(UI.limitSub) + "</div></div>" +
      '<button type="button" class="btn primary" id="again">Try again</button>';
    $("#again").addEventListener("click", () => location.reload());
    toBottom(true);
  }


  /* ---------- boot ---------- */
  $("#intro-goal").textContent = UI.goal;
  $("#intro-constraint").textContent = UI.constraint;
  function startApp() { $("#intro").hidden = true; $("#app").hidden = false; renderPage(state.page); }
  $("#start").addEventListener("click", () => { startApp(); loadPicker(); });
})();
</script>
</body>
